<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uber Translate</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 340px; margin: 0; padding: 12px;
        font: 14px/1.5 system-ui, sans-serif;
        background: Canvas; color: CanvasText;
      }
      h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .row label { color: GrayText; font-size: 12px; }
      select, textarea, button { font: inherit; }
      select { flex: 1; padding: 4px; border-radius: 6px; }
      textarea {
        width: 100%; box-sizing: border-box; min-height: 72px; resize: vertical;
        border-radius: 6px; padding: 6px; border: 1px solid GrayText;
      }
      .result {
        min-height: 40px; white-space: pre-wrap; background: Field; color: FieldText;
        border-radius: 6px; padding: 8px; margin: 8px 0; border: 1px solid GrayText;
      }
      .result.error { border-color: #d93025; color: #d93025; }
      button {
        cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px;
        background: #1a73e8; color: #fff;
      }
      button.secondary { background: transparent; color: #1a73e8; border: 1px solid #1a73e8; }
      .actions { display: flex; gap: 8px; }
      .result-wrap { position: relative; }
      .copy-btn {
        position: absolute; top: 6px; right: 6px; display: none;
        padding: 3px 8px; font-size: 12px; background: transparent;
        color: #1a73e8; border: 1px solid #1a73e8;
      }
      .result-wrap.has-result .copy-btn { display: block; }
      .footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
      .provider { color: GrayText; font-size: 12px; }
      .links { display: flex; gap: 12px; }
      a { color: #1a73e8; font-size: 12px; cursor: pointer; }
      .history { margin-top: 10px; border-top: 1px solid GrayText; padding-top: 8px; }
      .history-head {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; color: GrayText; margin-bottom: 6px;
      }
      .hist-empty { color: GrayText; font-size: 12px; padding: 8px 0; }
      .hist-item {
        cursor: pointer; border: 1px solid GrayText; border-radius: 6px;
        padding: 6px 8px; margin-bottom: 6px; background: Field; color: FieldText;
      }
      .hist-item:hover { border-color: #1a73e8; }
      .hist-dst { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hist-src {
        font-size: 12px; color: GrayText; margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .hist-meta { font-size: 11px; color: GrayText; margin-top: 4px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>🌐 Uber Translate</h1>
    <div class="row">
      <label>대상</label>
      <select id="target"></select>
    </div>
    <textarea id="input" placeholder="번역할 텍스트를 입력하세요"></textarea>
    <div class="actions">
      <button id="translate">번역</button>
      <button id="translatePage" class="secondary">이 페이지 번역</button>
      <button id="restorePage" class="secondary">원문 복원</button>
    </div>
    <div class="result-wrap" id="resultWrap">
      <button id="copy" class="copy-btn" title="번역 결과 복사">복사</button>
      <div id="result" class="result"></div>
    </div>
    <div class="footer">
      <span class="provider" id="provider"></span>
      <div class="links">
        <a id="toggleHistory">이력</a>
        <a id="openOptions">설정</a>
      </div>
    </div>
    <div id="historyPanel" class="history hidden">
      <div class="history-head">
        <span>번역 이력</span>
        <a id="clearHistory">모두 지우기</a>
      </div>
      <div id="historyList"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
