<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Uber Translate 브랜드 마크: 아이리스 그라디언트 타일 + A文 (스크립트 간 번역) -->
  <!-- 이 파일이 로고 원본. PNG는 scripts/gen-icons.sh 로 생성 -->
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6DFF"/>
