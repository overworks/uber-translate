      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#iris)"/>
  <text x="252" y="272" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
